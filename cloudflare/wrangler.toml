# AFSANA Cloudflare production configuration
# Deploy trigger: activate free chunked video uploads via KV.
name = "afsana-perfumes11"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[cache]
enabled = true

[[kv_namespaces]]
binding = "AFSANA_MEDIA_FREE"
id = "c0168837510e4188bc655a7b4f25c0a4"
preview_id = "9817ea33d7c149e6b41c1c31439d71f0"

[[durable_objects.bindings]]
name = "MONGODB_CONNECTION"
class_name = "MongoDBConnection"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoDBConnection"]

[placement]
mode = "smart"

[previews.placement]
mode = "smart"



[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
