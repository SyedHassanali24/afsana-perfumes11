# AFSANA Cloudflare recovery configuration
name = "afsana-perfumes11"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[cache]
enabled = true

[placement]
mode = "smart"

[previews.placement]
mode = "smart"
