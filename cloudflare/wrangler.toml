name = "afsana-perfumes11"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[cache]
enabled = true

[[durable_objects.bindings]]
name = "MONGODB_CONNECTION"
class_name = "MongoDBConnection"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoDBConnection"]

[placement]
mode = "smart"

[previews.placement]
mode = "smart"

# Preview API calls use the existing production Worker backend so the
# branch preview does not need a second copy of MongoDB/JWT secrets.
[[previews.services]]
binding = "AFSANA_PROD_API"
service = "afsana-perfumes11"
