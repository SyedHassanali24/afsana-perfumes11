name = "afsana-perfumes11"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[[kv_namespaces]]
binding = "AFSANA_MEDIA_FREE"
id = "c0168837510e4188bc655a7b4f25c0a4"

[vars]
ALLOWED_ORIGINS = "https://afsanaperfumes.store,https://www.afsanaperfumes.store,https://afsana-perfumes11.eastwala12.workers.dev"
EMAILJS_SERVICE_ID = "service_jx5mizj"
EMAILJS_TEMPLATE_ID = "template_36spa09"
RATE_LIMIT_FAIL_OPEN = "false"
SITE_URL = "https://afsanaperfumes.store"
TURNSTILE_SITE_KEY = "0x4AAAAAAF06iSkhZh8g9mEb"

[[durable_objects.bindings]]
name = "MONGODB_CONNECTION"
class_name = "MongoDBConnection"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoDBConnection"]

[placement]
mode = "smart"

[cache]
enabled = true

[previews.placement]
mode = "smart"
