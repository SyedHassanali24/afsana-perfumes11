name: Deploy AFSANA Cloudflare Worker
# Production deployment is intentionally manual and explicitly gated.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY-HASSAN-APPROVED only after the exact change is reviewed."
        required: true
        type: choice
        options:
          - NO-DEPLOY
          - DEPLOY-HASSAN-APPROVED
        default: NO-DEPLOY

permissions:
  contents: read

concurrency:
  group: afsana-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm_production == 'DEPLOY-HASSAN-APPROVED'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build React frontend for Cloudflare Static Assets
        run: npm run build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eb104cb2498331e8ace489bbf746dc15
        run: npx --yes wrangler deploy --config cloudflare/wrangler.toml
