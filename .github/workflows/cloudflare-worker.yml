name: Deploy AFSANA Cloudflare Worker
# Cloudflare is the only production storefront and API runtime.

on:
  push:
    branches: ["main", "feat/universal-afsana-page-builder"]
    paths:
      - "admin/**"
      - "cloudflare/**"
      - "functions/**"
      - "netlify/functions/**"
      - "middleware/**"
      - "database/**"
      - "validation/**"
      - "tools/cloudflare-smoke.mjs"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build React frontend and Cloudflare API Worker
        run: npm run build
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eb104cb2498331e8ace489bbf746dc15
        run: npx --yes wrangler deploy --config cloudflare/wrangler.toml
      - name: Verify live Cloudflare API and MongoDB
        env:
          AFSANA_BASE_URL: https://afsana-perfumes11.eastwala12.workers.dev
        run: node tools/cloudflare-smoke.mjs
