name: Validate Hassan Cloudflare restore

on:
  push:
    branches:
      - restore/hassan-cloudflare-staged-2026-11-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Parse frontend
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build storefront
        run: npm run build
